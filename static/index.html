<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automix Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Controls -->
        <aside class="sidebar">
            <div class="logo">
                <h1>Automix</h1>
                <div class="pulse-indicator"></div>
            </div>
            
            <div class="control-panel">
                <h3>Library Management</h3>
                <div class="input-group">
                    <input type="text" id="dirInput" placeholder="d:\Music" value="">
                    <button id="scanBtn" class="btn primary">Scan Directory</button>
                </div>
                <p id="scanStatus" class="status-text"></p>
            </div>

            <div class="control-panel mt-auto">
                <h3>Playback Controls</h3>
                <button id="automixBtn" class="btn mix-btn" disabled>Generate Automix</button>
                <div class="deck-controls">
                    <button id="crossfadeBtn" class="btn secondary">Manual Crossfade</button>
                    <button id="stopBtn" class="btn danger">Stop Playback</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h2>Your Library</h2>
                <div class="stats">
                    <span id="trackCount">0</span> tracks indexed
                </div>
            </header>

            <div class="library-container">
                <table class="track-table">
                    <thead>
                        <tr>
                            <th width="40px"><input type="checkbox" id="selectAll"></th>
                            <th>Title</th>
                            <th>Artist</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody id="trackList">
                        <!-- Tracks populated here -->
                    </tbody>
                </table>
            </div>
            
            <div class="queue-panel" id="queuePanel" style="display: none;">
                <h3>Automix Queue (Smart Reordered)</h3>
                <div id="queueList" class="queue-list"></div>
            </div>
        </main>
    </div>

    <!-- Music Controller Layout -->
    <div class="player-bar">
        <div class="now-playing">
            <div id="npTitle" class="np-title">--</div>
            <div id="npArtist" class="np-artist">--</div>
        </div>
        <div class="player-controls">
            <button id="playPauseBtn" class="btn-icon">⏸</button>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="seekSlider" min="0" max="100" value="0">
                <span id="totalTime">0:00</span>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
